<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极速赛道 · 注册</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand-mark"><span></span><span></span><span></span></div>
      <h1>注册车手</h1>
      <p class="sub">创建账号，成绩按圈数计入排行榜</p>
      <form method="post" action="{{ url_for('register') }}">
        <label>用户名
          <input name="username" type="text" autocomplete="username" placeholder="2-16 位字母、数字或中文" required autofocus>
        </label>
        <label>密码
          <input name="password" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
        </label>
        <label>确认密码
          <input name="confirm" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
        </label>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <button class="btn primary" type="submit">注册并上车</button>
      </form>
      <p class="switch">已有账号？<a href="{{ url_for('login_page') }}">返回登录</a></p>
    </div>
  </div>
</body>
</html>
